# AnimeStream — Docker Hub production Compose (image pull only, no local build)
#
# Prerequisites on the server:
#   - Docker Engine 24+ / Compose v2
#   - .env next to this file (copy from .env.example)
#   - DOCKERHUB_USERNAME must match the Hub namespace that CI pushes to
#
# Start (website only — no crawler worker keys required):
#   cp .env.example .env && chmod 600 .env
#   # fill required vars + DOCKERHUB_USERNAME + optional APP_PORT=13000
#   docker compose pull app
#   docker compose up -d app
#   curl -sS "http://127.0.0.1:${APP_PORT:-3000}/api/live"
#
# Upgrade:
#   docker compose pull app && docker compose up -d --no-build app
#
# Optional worker (only if you intentionally run a crawler node):
#   mkdir -p data/crawler-worker
#   docker compose --profile worker pull
#   docker compose --profile worker up -d
#
# Reverse proxy MUST terminate TLS and block public /api/internal/crawler/**

services:
  app:
    image: ${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME to your Hub namespace}/hentaiworkers-app:${APP_IMAGE_TAG:-latest}
    ports:
      # Host publish only: APP_HOST_BIND:APP_PORT -> container 3000
      - "${APP_HOST_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  crawler-worker:
    profiles: ["worker"]
    image: ${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME to your Hub namespace}/hentaiworkers-worker:${WORKER_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      CRAWLER_CONTROL_URL: http://app:3000/api/internal/crawler/v1
      CRAWLER_WORKER_ID: ${CRAWLER_WORKER_ID:-1}
      # Optional at parse time; required only when this profile is started.
      CRAWLER_WORKER_TOKEN: ${CRAWLER_WORKER_TOKEN:-}
      CRAWLER_TEMP_DIR: /var/tmp/crawler-worker
      CRAWLER_WORKER_VERSION: "1.0.0"
    volumes:
      - ./data/crawler-worker:/var/tmp/crawler-worker
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
