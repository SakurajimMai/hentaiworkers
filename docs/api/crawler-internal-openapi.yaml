openapi: 3.0.3
info:
  title: Anime Crawler Internal Worker API
  version: 1.0.0
  description: |
    Control-plane API for crawler workers. Not public.
    Production ingress MUST deny public access to /api/internal/crawler/**.
servers:
  - url: /api/internal/crawler/v1
paths:
  /workers/register:
    post:
      summary: Register worker capabilities
      security: [{ workerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registered
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: WORKER_INCOMPATIBLE
  /workers/{workerId}/heartbeat:
    post:
      summary: Worker-level heartbeat
      security: [{ workerBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/workerId'
      responses:
        '200':
          description: OK
  /jobs/claim:
    post:
      summary: Claim next compatible job (long-poll up to 20s)
      security: [{ workerBearer: [] }]
      responses:
        '200':
          description: Claimed job + lease token
        '204':
          description: No job available
  /jobs/{id}/start:
    post:
      summary: Start claimed job
      security: [{ workerBearer: [], leaseToken: [] }]
      parameters:
        - $ref: '#/components/parameters/jobId'
      responses:
        '200':
          description: Running
        '409':
          description: LEASE_LOST or conflict
  /jobs/{id}/heartbeat:
    post:
      summary: Job lease heartbeat; returns cancelRequested
      security: [{ workerBearer: [], leaseToken: [] }]
      parameters:
        - $ref: '#/components/parameters/jobId'
      responses:
        '200':
          description: Renewed
  /jobs/{id}/events/batch:
    post:
      summary: Batch log events (max 100 / 256KiB)
      security: [{ workerBearer: [], leaseToken: [] }]
      parameters:
        - $ref: '#/components/parameters/jobId'
      responses:
        '200':
          description: Accepted
        '413':
          description: BATCH_TOO_LARGE
  /jobs/{id}/media/reserve:
    post:
      summary: Reserve staging/final object keys
      security: [{ workerBearer: [], leaseToken: [] }]
      parameters:
        - $ref: '#/components/parameters/jobId'
      responses:
        '200':
          description: Reserved
  /jobs/{id}/credentials/refresh:
    post:
      summary: Short-lived storage credentials (Cache-Control no-store)
      security: [{ workerBearer: [], leaseToken: [] }]
      parameters:
        - $ref: '#/components/parameters/jobId'
      responses:
        '200':
          description: Temporary credentials
  /jobs/{id}/items/commit:
    post:
      summary: Idempotent item commit
      security: [{ workerBearer: [], leaseToken: [] }]
      parameters:
        - $ref: '#/components/parameters/jobId'
      responses:
        '200':
          description: Committed or replayed
        '409':
          description: RESULT_CONFLICT
  /jobs/{id}/complete:
    post:
      summary: Complete job (idempotent)
      security: [{ workerBearer: [], leaseToken: [] }]
      parameters:
        - $ref: '#/components/parameters/jobId'
      responses:
        '200':
          description: Terminal success states
  /jobs/{id}/fail:
    post:
      summary: Fail job (idempotent)
      security: [{ workerBearer: [], leaseToken: [] }]
      parameters:
        - $ref: '#/components/parameters/jobId'
      responses:
        '200':
          description: Failed or retry_wait
components:
  securitySchemes:
    workerBearer:
      type: http
      scheme: bearer
      description: Machine token (hash stored server-side)
    leaseToken:
      type: apiKey
      in: header
      name: X-Crawler-Lease-Token
  parameters:
    workerId:
      name: workerId
      in: path
      required: true
      schema: { type: integer }
    jobId:
      name: id
      in: path
      required: true
      schema: { type: integer }
  responses:
    Unauthorized:
      description: WORKER_TOKEN_INVALID or WORKER_TOKEN_REVOKED
    Forbidden:
      description: WORKER_FORBIDDEN
  schemas:
    RegisterRequest:
      type: object
      required: [capabilities]
      properties:
        workerId: { type: integer }
        name: { type: string }
        capabilities:
          type: object
          required:
            - protocolVersion
            - workerVersion
            - sources
            - storageDrivers
            - configSchemaVersions
            - maxConcurrency
          properties:
            protocolVersion: { type: integer }
            workerVersion: { type: string }
            sources:
              type: array
              items: { type: string }
            storageDrivers:
              type: array
              items: { type: string, enum: [s3, sftp] }
            configSchemaVersions:
              type: array
              items: { type: integer }
            maxConcurrency: { type: integer }
            currentLoad: { type: integer }
            browserVersion: { type: string }
