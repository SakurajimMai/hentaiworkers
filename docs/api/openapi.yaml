openapi: 3.0.3
info:
  title: AnimeStream Public API
  version: 1.0.0
  description: |
    AnimeStream 匿名公开 REST API。章节读取会记录一次榜单浏览。

    - 无需鉴权
    - 目录数据源：远程 MySQL（经 Next.js Route Handlers）
    - Android 更新清单来自固定 GitHub Releases 仓库，不访问数据库
    - 里番列表默认仅返回上架作品（`is_active = 1` 或 `NULL`）
    - 里番详情按 id 直查，当前不使用 `is_active` 作为访问控制
    - 漫画接口仅返回已发布作品；栏目关闭时返回 404
  contact:
    name: AnimeStream

servers:
  - url: /
    description: Same-origin API (production)
  - url: http://localhost:3000
    description: Local development

tags:
  - name: System
  - name: Ads
  - name: Animes
  - name: Tags
  - name: Mangas
  - name: Android

paths:
  /api/live:
    get:
      tags: [System]
      summary: Process liveness
      description: Confirms that the application process can handle requests; no dependencies are checked.
      operationId: getLive
      responses:
        "200":
          description: Process is live
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStatus"

  /api/ready:
    get:
      tags: [System]
      summary: Dependency readiness
      description: |
        Runs `SELECT 1` when `DATABASE_URL` is configured. Without `DATABASE_URL`,
        the current implementation reports ready. This does not validate migrations
        or application tables.
      operationId: getReady
      responses:
        "200":
          description: Configured readiness checks passed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
        "503":
          description: A configured dependency check failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotReadyStatus"

  /api/health:
    get:
      tags: [System]
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service and database are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOk"
        "500":
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthError"

  /api/ads:
    get:
      tags: [Ads]
      summary: Public ad placements
      description: |
        Enabled feed slots plus reader / player ads from admin system settings.
        Used by the website (including mobile browsers) and the Android app.
      operationId: getPublicAds
      responses:
        "200":
          description: Public ads config (no secrets)
          headers:
            Cache-Control:
              $ref: "#/components/headers/PublicReadCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAdsConfig"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/android/update:
    get:
      tags: [Android]
      summary: Latest verified Android release
      description: |
        Returns the largest complete `build-N` release from the fixed public GitHub
        repository. Drafts, non-main targets, incomplete assets, untrusted download
        paths, empty files, and assets without a SHA-256 digest are ignored.
      operationId: getAndroidUpdate
      responses:
        "200":
          description: Verified APK manifest for all supported ABIs
          headers:
            Cache-Control:
              $ref: "#/components/headers/AndroidUpdateCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AndroidUpdateManifest"
        "502":
          description: No cached manifest and GitHub metadata is unavailable or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/animes:
    get:
      tags: [Animes]
      summary: List animes
      operationId: listAnimes
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 48
        - name: sort
          in: query
          description: "`latest` by updated_at with created_at fallback; `popular` by view_count"
          schema:
            type: string
            enum: [latest, popular]
            default: latest
        - name: tag
          in: query
          description: Filter by tag id
          schema:
            type: integer
            minimum: 1
        - name: search
          in: query
          description: Fuzzy match title, title_japanese, title_english, or description
          schema:
            type: string
      responses:
        "200":
          description: Paginated anime list
          headers:
            Cache-Control:
              $ref: "#/components/headers/PublicReadCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnimeListResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/animes/{id}:
    get:
      tags: [Animes]
      summary: Get anime detail
      description: Direct id lookup; the current handler does not filter by `is_active`.
      operationId: getAnime
      parameters:
        - $ref: "#/components/parameters/AnimeId"
      responses:
        "200":
          description: Full anime record with tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnimeDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/animes/{id}/similar:
    get:
      tags: [Animes]
      summary: Similar animes
      operationId: getSimilarAnimes
      description: |
        Series-prefix match first. If the current anime has tags, shared-tag
        matches fill the remainder; popular items are used only when it has no tags.
        Invalid id returns empty array.
      parameters:
        - $ref: "#/components/parameters/AnimeId"
      responses:
        "200":
          description: Similar items (up to ~12)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnimeSimilarItem"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/tags:
    get:
      tags: [Tags]
      summary: List tags used by active animes
      operationId: listTags
      parameters:
        - name: limit
          in: query
          description: Response size, clamped to 1..100
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        "200":
          description: Distinct tags linked to active animes, ordered by name
          headers:
            Cache-Control:
              $ref: "#/components/headers/PublicReadCacheControl"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagSummary"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/mangas:
    get:
      tags: [Mangas]
      summary: List published mangas
      operationId: listMangas
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
        - name: q
          in: query
          description: Fuzzy match title, author, or manga tag
          schema:
            type: string
        - name: tag
          in: query
          description: Manga-owned tag name (not 里番 tag id)
          schema:
            type: string
        - name: rank
          in: query
          schema:
            type: string
            enum: [day, week, month, all]
      responses:
        "200":
          description: Manga list
          headers:
            Cache-Control:
              $ref: "#/components/headers/PublicReadCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MangaListResponse"
        "404":
          description: Manga section disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/mangas/{id}:
    get:
      tags: [Mangas]
      summary: Manga detail
      operationId: getManga
      parameters:
        - name: id
          in: path
          description: Published manga slug; a numeric database id is also accepted
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Manga with chapter summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MangaDetail"
        "404":
          description: Not found or manga disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/mangas/{id}/chapters/{number}:
    get:
      tags: [Mangas]
      summary: Chapter pages
      operationId: getMangaChapter
      parameters:
        - name: id
          in: path
          description: Published manga slug; a numeric database id is also accepted
          required: true
          schema:
            type: string
            minLength: 1
        - name: number
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Chapter pages; records one ranked view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MangaChapterResponse"
        "404":
          description: Not found or manga disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  headers:
    PublicReadCacheControl:
      description: Shared-cache policy for public catalog lists, tags, and ads
      schema:
        type: string
        example: "public, max-age=30, stale-while-revalidate=120, stale-if-error=900"
    AndroidUpdateCacheControl:
      description: Shared-cache policy for the Android release manifest
      schema:
        type: string
        example: "public, max-age=300, stale-while-revalidate=900, stale-if-error=86400"

  parameters:
    AnimeId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    LiveStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [live]

    ReadyStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]

    NotReadyStatus:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          type: string
          enum: [not_ready]
        reason:
          type: string

    HealthOk:
      type: object
      required: [ok, database, result, version]
      properties:
        ok:
          type: boolean
          example: true
        database:
          type: string
          example: mysql
        result:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [ok]
            properties:
              ok:
                type: integer
                example: 1
        version:
          type: string
          example: "1.0.0"

    HealthError:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: string

    PublicFeedAdSlot:
      type: object
      required: [enabled, name, interval, href, html]
      properties:
        enabled:
          type: boolean
        name:
          type: string
        interval:
          type: integer
          minimum: 1
          maximum: 40
        href:
          type: string
        html:
          type: string

    PublicReaderAdSlot:
      type: object
      required: [enabled, html, interval]
      properties:
        enabled:
          type: boolean
        html:
          type: string
        interval:
          type: integer
          minimum: 1
          maximum: 50

    PublicPlayerPreRollAd:
      type: object
      required: [enabled, videoUrl, imageUrl, html, clickUrl, playDuration, totalDuration, muted]
      properties:
        enabled:
          type: boolean
        videoUrl:
          type: string
        imageUrl:
          type: string
        html:
          type: string
        clickUrl:
          type: string
        playDuration:
          type: integer
          minimum: 0
          maximum: 120
        totalDuration:
          type: integer
          minimum: 0
          maximum: 180
        muted:
          type: boolean

    PublicPlayerPauseAd:
      type: object
      required: [enabled, videoUrl, imageUrl, html, clickUrl, muted]
      properties:
        enabled:
          type: boolean
        videoUrl:
          type: string
        imageUrl:
          type: string
        html:
          type: string
        clickUrl:
          type: string
        muted:
          type: boolean

    PublicAdsConfig:
      type: object
      required: [feedSlots, reader, player]
      properties:
        feedSlots:
          type: array
          items:
            $ref: "#/components/schemas/PublicFeedAdSlot"
        reader:
          type: object
          required: [top, middle, bottom]
          properties:
            top:
              $ref: "#/components/schemas/PublicReaderAdSlot"
            middle:
              $ref: "#/components/schemas/PublicReaderAdSlot"
            bottom:
              $ref: "#/components/schemas/PublicReaderAdSlot"
        player:
          type: object
          required: [preRollAd, pauseAd]
          properties:
            preRollAd:
              $ref: "#/components/schemas/PublicPlayerPreRollAd"
            pauseAd:
              $ref: "#/components/schemas/PublicPlayerPauseAd"

    AndroidUpdateAsset:
      type: object
      required: [name, url, size, sha256]
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
          pattern: "^https://github\\.com/SakurajimMai/hentaiworkers/releases/download/build-[1-9][0-9]*/"
        size:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"

    AndroidUpdateManifest:
      type: object
      required: [schemaVersion, packageName, versionCode, releaseTag, releaseName, publishedAt, releasePageUrl, apks, checksums]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        packageName:
          type: string
          enum: [de.ixacg.animestream]
        versionCode:
          type: integer
          minimum: 1
          maximum: 2100000000
        releaseTag:
          type: string
          pattern: "^build-[1-9][0-9]*$"
        releaseName:
          type: string
        publishedAt:
          type: string
          format: date-time
        releasePageUrl:
          type: string
          format: uri
          pattern: "^https://github\\.com/SakurajimMai/hentaiworkers/releases/tag/build-[1-9][0-9]*$"
        apks:
          type: object
          required: [arm64-v8a, armeabi-v7a, x86_64, x86, universal]
          additionalProperties: false
          properties:
            arm64-v8a:
              $ref: "#/components/schemas/AndroidUpdateAsset"
            armeabi-v7a:
              $ref: "#/components/schemas/AndroidUpdateAsset"
            x86_64:
              $ref: "#/components/schemas/AndroidUpdateAsset"
            x86:
              $ref: "#/components/schemas/AndroidUpdateAsset"
            universal:
              $ref: "#/components/schemas/AndroidUpdateAsset"
        checksums:
          $ref: "#/components/schemas/AndroidUpdateAsset"

    Pagination:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    AnimeListItem:
      type: object
      required: [id, title, cover, viewCount, titleEnglish]
      properties:
        id:
          type: integer
        title:
          type: string
        cover:
          type: string
          nullable: true
        viewCount:
          type: integer
          nullable: true
        titleEnglish:
          type: string
          nullable: true

    AnimeListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AnimeListItem"
        pagination:
          $ref: "#/components/schemas/Pagination"

    Tag:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true

    TagSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    AnimeDetail:
      type: object
      required: [id, title, titleEnglish, titleJapanese, description, cover, fanart, videoUrl, releaseYear, releaseDate, viewCount, favoriteCount, isActive, categoryId, createdAt, updatedAt, tags]
      properties:
        id:
          type: integer
        title:
          type: string
        titleEnglish:
          type: string
          nullable: true
        titleJapanese:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        cover:
          type: string
          nullable: true
        fanart:
          type: string
          nullable: true
          description: Comma-separated image URLs
        videoUrl:
          type: string
        releaseYear:
          type: integer
          nullable: true
        releaseDate:
          type: string
          nullable: true
        viewCount:
          type: integer
          nullable: true
        favoriteCount:
          type: integer
          nullable: true
        isActive:
          type: integer
          nullable: true
        categoryId:
          type: integer
          nullable: true
        createdAt:
          type: string
          nullable: true
        updatedAt:
          type: string
          nullable: true
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"

    AnimeSimilarItem:
      type: object
      required: [id, title, cover, fanart, viewCount]
      properties:
        id:
          type: integer
        title:
          type: string
        cover:
          type: string
          nullable: true
        fanart:
          type: string
          nullable: true
        viewCount:
          type: integer
          nullable: true
        matches:
          type: integer
          description: Present when ranked by shared tags
          nullable: true

    MangaSummary:
      type: object
      required:
        - id
        - slug
        - title
        - author
        - tags
        - description
        - coverUrl
        - chapterCount
        - pageCount
        - sourceChatTitle
        - updatedAt
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          type: string
        author:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        description:
          type: string
          nullable: true
        coverUrl:
          type: string
          nullable: true
        chapterCount:
          type: integer
        pageCount:
          type: integer
        sourceChatTitle:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true

    MangaListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MangaSummary"
        pagination:
          $ref: "#/components/schemas/Pagination"

    MangaChapterSummary:
      type: object
      required: [id, number, title, pageCount, createdAt]
      properties:
        id:
          type: integer
        number:
          type: integer
        title:
          type: string
          nullable: true
        pageCount:
          type: integer
        createdAt:
          type: string
          format: date-time
          nullable: true

    MangaDetail:
      allOf:
        - $ref: "#/components/schemas/MangaSummary"
        - type: object
          required: [chapters]
          properties:
            chapters:
              type: array
              items:
                $ref: "#/components/schemas/MangaChapterSummary"

    MangaPage:
      type: object
      required: [index, imageUrl]
      properties:
        index:
          type: integer
        imageUrl:
          type: string

    MangaChapterResponse:
      type: object
      required: [manga, chapter]
      properties:
        manga:
          type: object
          required: [id, title, coverUrl]
          properties:
            id:
              type: integer
            title:
              type: string
            coverUrl:
              type: string
              nullable: true
        chapter:
          allOf:
            - $ref: "#/components/schemas/MangaChapterSummary"
            - type: object
              required: [pages]
              properties:
                pages:
                  type: array
                  items:
                    $ref: "#/components/schemas/MangaPage"

  responses:
    ServerError:
      description: Unexpected server, database, or upstream error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
