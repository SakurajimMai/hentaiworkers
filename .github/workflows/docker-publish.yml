name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_IMAGE: sakurajiamai/hentaiworkers-app

jobs:
  publish:
    name: Build and push app
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (app)
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.APP_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=manga,enable={{is_default_branch}}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          provenance: false

  cleanup:
    name: Retain latest five Actions runs
    needs: publish
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    concurrency:
      group: repository-actions-retention
      cancel-in-progress: false

    steps:
      - name: Delete older completed runs
        uses: actions/github-script@v9
        with:
          script: |
            const retainedRunCount = 5;
            const { owner, repo } = context.repo;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 },
              (response) => response.data.workflow_runs,
            );

            runs.sort((left, right) =>
              Date.parse(right.created_at) - Date.parse(left.created_at) ||
              right.id - left.id
            );

            const retainedIds = new Set(
              runs.slice(0, retainedRunCount).map((run) => run.id),
            );
            const candidates = runs.filter((run) =>
              !retainedIds.has(run.id) &&
              String(run.id) !== String(context.runId) &&
              run.status === 'completed'
            );

            for (const run of candidates) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
                core.info(`Deleted Actions run ${run.id}`);
              } catch (error) {
                if (error?.status === 404) {
                  core.info(`Actions run ${run.id} was already deleted`);
                  continue;
                }
                throw error;
              }
            }

            core.info(
              `Retained ${Math.min(retainedRunCount, runs.length)} latest Actions runs`,
            );
