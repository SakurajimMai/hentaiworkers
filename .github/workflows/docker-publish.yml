name: Publish Docker images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/hentaiworkers-app
  OPS_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/hentaiworkers-ops
  WORKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/hentaiworkers-worker

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    # Prefer current Actions Node runtime (Node 24); avoid Node 20 deprecation noise.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail fast on worker lock conflicts before Docker login/build (Python 3.12 matches Dockerfile.worker).
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check worker requirements lock
        run: npm run check:worker-requirements

      - name: Check ops requirements lock
        run: npm ci --omit=dev --ignore-scripts --prefix ops

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (app)
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.APP_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Docker metadata (ops)
        id: meta-ops
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.OPS_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Docker metadata (worker)
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WORKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          provenance: false

      - name: Build and push ops image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ops
          push: true
          tags: ${{ steps.meta-ops.outputs.tags }}
          labels: ${{ steps.meta-ops.outputs.labels }}
          cache-from: type=gha,scope=ops
          cache-to: type=gha,mode=max,scope=ops
          provenance: false

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
          provenance: false
