name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPO_PUBLIC_API_BASE_URL: https://www.ixacg.de
  NODE_ENV: production

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000 && break
            echo "npm ci attempt $i failed, retrying..."
            rm -rf node_modules
            sleep 10
          done

      - name: Set Android versionCode from run number
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'app.json';
          const json = JSON.parse(fs.readFileSync(path, 'utf8'));
          json.expo.android = json.expo.android || {};
          json.expo.android.package = json.expo.android.package || 'de.ixacg.animestream';
          json.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER || 1);
          json.expo.extra = json.expo.extra || {};
          json.expo.extra.apiBaseUrl = process.env.EXPO_PUBLIC_API_BASE_URL;
          fs.writeFileSync(path, JSON.stringify(json, null, 2) + '\n');
          NODE

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            {
              echo "MYAPP_UPLOAD_STORE_FILE=release.keystore"
              echo "MYAPP_UPLOAD_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
              echo "MYAPP_UPLOAD_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
              echo "MYAPP_UPLOAD_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
            } >> android/gradle.properties
            python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          text = p.read_text()
          if 'MYAPP_UPLOAD_STORE_FILE' not in text:
              signing = '''
              signingConfigs {
                  release {
                      storeFile file(MYAPP_UPLOAD_STORE_FILE)
                      storePassword MYAPP_UPLOAD_STORE_PASSWORD
                      keyAlias MYAPP_UPLOAD_KEY_ALIAS
                      keyPassword MYAPP_UPLOAD_KEY_PASSWORD
                  }
              }
          '''
              text = text.replace('android {', 'android {' + signing, 1)
              text = text.replace(
                  'release {',
                  'release {\n            signingConfig signingConfigs.release',
                  1,
              )
              p.write_text(text)
          PY
          else
            echo "No release keystore secret; using Expo debug signing for internal distribution."
          fi

      - name: Enable ABI splits
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              splits {
                  abi {
                      reset()
                      enable true
                      universalApk true
                      include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
                  }
              }
          }
          EOF

      - name: Grant gradlew execute permission
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Smoke test release APK startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none
          script: |
            adb install -r mobile/android/app/build/outputs/apk/release/app-universal-release.apk
            adb logcat -c
            adb shell am force-stop de.ixacg.animestream
            adb shell am start -W -n de.ixacg.animestream/.MainActivity
            sleep 8
            if [ -z "$(adb shell pidof de.ixacg.animestream | tr -d '\r')" ]; then echo "AnimeStream process is not running after launch"; adb logcat -d -v brief; exit 1; fi
            if adb logcat -d -v brief | grep -E "FATAL EXCEPTION|AndroidRuntime|ReactNativeJS"; then echo "AnimeStream startup produced a fatal runtime error"; exit 1; fi

      - name: Rename APKs
        run: |
          mkdir -p artifacts
          BUILD=${{ github.run_number }}
          declare -A MAP=(
            [app-armeabi-v7a-release.apk]="AnimeStream-${BUILD}-armeabi-v7a.apk"
            [app-arm64-v8a-release.apk]="AnimeStream-${BUILD}-arm64-v8a.apk"
            [app-x86-release.apk]="AnimeStream-${BUILD}-x86.apk"
            [app-x86_64-release.apk]="AnimeStream-${BUILD}-x86_64.apk"
            [app-universal-release.apk]="AnimeStream-${BUILD}-universal.apk"
          )
          for src in "${!MAP[@]}"; do
            if [ -f "android/app/build/outputs/apk/release/$src" ]; then
              cp "android/app/build/outputs/apk/release/$src" "artifacts/${MAP[$src]}"
            fi
          done
          ls -lh artifacts/

      - name: Generate release notes from commits
        working-directory: ${{ github.workspace }}
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep '^build-' | grep -v "^build-${{ github.run_number }}$" | head -1 || true)
          {
            echo "## Changes"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "Since \`$PREV_TAG\`:"
              echo
              git log --no-merges --pretty=format:"- %s (%h)" "$PREV_TAG..HEAD"
            else
              git log --no-merges --pretty=format:"- %s (%h)" -20
            fi
            echo
            echo
            echo "## APK Variants"
            echo
            echo "Pick the APK matching your device CPU. \`universal\` works on all devices but is larger."
            echo
            echo "- \`arm64-v8a\` — most modern Android phones (recommended)"
            echo "- \`armeabi-v7a\` — older 32-bit phones"
            echo "- \`x86_64\` / \`x86\` — emulators and rare Intel devices"
            echo "- \`universal\` — fallback that runs anywhere"
          } > release-notes.md
          cat release-notes.md

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeStream-apk-${{ github.run_number }}
          path: mobile/artifacts/AnimeStream-*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AnimeStream Build ${{ github.run_number }}
          files: mobile/artifacts/AnimeStream-*.apk
          body_path: release-notes.md
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
