name: Build Android APK

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified production-signed APKs to GitHub Releases
        required: false
        default: false
        type: boolean

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  ANIMESTREAM_API_BASE_URL: https://www.ixacg.de
  ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}

jobs:
  build:
    name: Check and build native APK
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'Production' || 'CI' }}
    outputs:
      signing_mode: ${{ steps.signing.outputs.mode }}
    defaults:
      run:
        working-directory: mobile/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Configure signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && \
             [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && \
             [ -n "$ANDROID_KEY_ALIAS" ] && \
             [ -n "$ANDROID_KEY_PASSWORD" ]; then
            key_store_path="$RUNNER_TEMP/animestream-release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_store_path"
            keytool -list \
              -keystore "$key_store_path" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" >/dev/null
            echo "ANDROID_KEYSTORE_PATH=$key_store_path" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=release" >> "$GITHUB_ENV"
            echo "mode=release" >> "$GITHUB_OUTPUT"
          elif [ -z "$ANDROID_KEYSTORE_BASE64" ] && \
               [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && \
               [ -z "$ANDROID_KEY_ALIAS" ] && \
               [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "SIGNING_MODE=internal-debug" >> "$GITHUB_ENV"
            echo "mode=internal-debug" >> "$GITHUB_OUTPUT"
            echo "No release keystore configured; this artifact is for internal testing only."
          else
            echo "Android signing secrets are only partially configured. Configure all four values or leave all four empty."
            exit 1
          fi

      - name: Grant wrapper permission
        run: chmod +x gradlew

      - name: Format, lint, test and assemble
        id: quality
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p app/build/reports
          set -o pipefail
          ./gradlew ktlintCheck lintRelease testDebugUnitTest assembleRelease --no-daemon --stacktrace 2>&1 | tee app/build/reports/ci-gradle.log

      - name: Generate Ktlint formatting patch
        if: failure() && steps.quality.outcome == 'failure'
        run: |
          ./gradlew ktlintFormat --no-daemon
          mkdir -p app/build/reports
          git -C "$GITHUB_WORKSPACE" diff --binary -- mobile/android > app/build/reports/ktlint-format.patch

      - name: Validate APK identity, ABI and contents
        run: |
          aapt_bin=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          apksigner_bin=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$aapt_bin"
          test -x "$apksigner_bin"
          output_dir="app/build/outputs/apk/release"
          metadata="$output_dir/output-metadata.json"
          output_map="$RUNNER_TEMP/apk-outputs.tsv"
          target_abis=(arm64-v8a armeabi-v7a x86_64 x86)
          test -s "$metadata"

          python3 - "$metadata" "$output_map" <<'PY'
          import json
          from pathlib import Path
          import sys

          metadata_path = Path(sys.argv[1])
          output_path = Path(sys.argv[2])
          expected_variants = ["arm64-v8a", "armeabi-v7a", "x86_64", "x86", "universal"]
          payload = json.loads(metadata_path.read_text(encoding="utf-8"))
          records = {}

          for element in payload.get("elements", []):
              filters = element.get("filters", [])
              if any(item.get("filterType") != "ABI" for item in filters):
                  raise SystemExit(f"APK output has a non-ABI filter: {element}")
              abi_filters = [
                  item.get("value")
                  for item in filters
                  if item.get("filterType") == "ABI"
              ]
              if len(abi_filters) > 1:
                  raise SystemExit(f"APK output has multiple ABI filters: {element}")
              variant = abi_filters[0] if abi_filters else "universal"
              filename = element.get("outputFile", "")
              if variant in records or not filename or Path(filename).name != filename:
                  raise SystemExit(f"Invalid APK output metadata: {element}")
              records[variant] = filename

          if set(records) != set(expected_variants):
              raise SystemExit(
                  f"Expected APK variants {expected_variants}, got {sorted(records)}"
              )

          output_path.write_text(
              "".join(f"{variant}\t{records[variant]}\n" for variant in expected_variants),
              encoding="utf-8",
          )
          PY

          apk_hashes=()
          certificate_digest_ref=""

          while IFS=$'\t' read -r variant output_file; do
            apk="$output_dir/$output_file"
            entries="app/build/reports/apk-entries-${variant}.txt"
            signature_report="app/build/reports/apk-signature-${variant}.txt"
            test -s "$apk"
            unzip -tq "$apk"
            unzip -Z1 "$apk" > "$entries"

            badging=$($aapt_bin dump badging "$apk")
            printf '%s\n' "$badging" | grep -F "package: name='de.ixacg.animestream' versionCode='${GITHUB_RUN_NUMBER}'"
            printf '%s\n' "$badging" | grep -F "launchable-activity: name='de.ixacg.animestream.MainActivity'"
            "$apksigner_bin" verify --verbose --print-certs "$apk" > "$signature_report"
            certificate_digest=$(sed -n 's/^.*certificate SHA-256 digest: //p' "$signature_report" | head -1)
            test -n "$certificate_digest"
            if [ -z "$certificate_digest_ref" ]; then
              certificate_digest_ref="$certificate_digest"
            else
              test "$certificate_digest" = "$certificate_digest_ref"
            fi
            apk_hashes+=("$(sha256sum "$apk" | cut -d ' ' -f 1)")

            if grep -Eqi 'index\.android\.bundle|\.hbc$|lib(reactnative|hermes|reanimated|worklets|gesturehandler)\.so' "$entries"; then
              echo "$variant APK still contains a JavaScript runtime or React Native bundle"
              exit 1
            fi

            if [ "$variant" = "universal" ]; then
              for abi in "${target_abis[@]}"; do
                printf '%s\n' "$badging" | grep -E "^native-code: .*'${abi}'"
                grep -q "^lib/${abi}/" "$entries"
              done
              if grep '^lib/' "$entries" | grep -Ev '^lib/(arm64-v8a|armeabi-v7a|x86_64|x86)/'; then
                echo "Universal APK contains an unexpected ABI"
                exit 1
              fi
            else
              printf '%s\n' "$badging" | grep -Fx "native-code: '${variant}'"
              grep -q "^lib/${variant}/" "$entries"
              if grep '^lib/' "$entries" | grep -Ev "^lib/${variant}/"; then
                echo "$variant APK contains an unexpected ABI"
                exit 1
              fi
            fi
          done < "$output_map"

          if [ "$SIGNING_MODE" = "release" ]; then
            expected_certificate_digest=$(
              printf '%s' "$ANDROID_RELEASE_CERT_SHA256" |
                tr -d ':' |
                tr '[:upper:]' '[:lower:]'
            )
            printf '%s\n' "$expected_certificate_digest" | grep -Eq '^[0-9a-f]{64}$'
            if [ "$certificate_digest_ref" != "$expected_certificate_digest" ]; then
              echo "Release APK certificate does not match ANDROID_RELEASE_CERT_SHA256"
              exit 1
            fi
          fi
          echo "APK_CERT_SHA256=$certificate_digest_ref" >> "$GITHUB_ENV"

          unique_hash_count=$(printf '%s\n' "${apk_hashes[@]}" | LC_ALL=C sort -u | wc -l)
          test "$unique_hash_count" -eq 5

          for abi in "${target_abis[@]}"; do
            grep "^lib/${abi}/" "app/build/reports/apk-entries-universal.txt" | LC_ALL=C sort > "$RUNNER_TEMP/universal-${abi}-libs.txt"
            grep "^lib/${abi}/" "app/build/reports/apk-entries-${abi}.txt" | LC_ALL=C sort > "$RUNNER_TEMP/split-${abi}-libs.txt"
            diff -u "$RUNNER_TEMP/universal-${abi}-libs.txt" "$RUNNER_TEMP/split-${abi}-libs.txt"
          done

      - name: Prepare ABI artifacts
        run: |
          mkdir -p ../artifacts
          while IFS=$'\t' read -r variant output_file; do
            cp "app/build/outputs/apk/release/$output_file" \
              "../artifacts/AnimeStream-${GITHUB_RUN_NUMBER}-${variant}.apk"
          done < "$RUNNER_TEMP/apk-outputs.tsv"
          artifact_count=$(find ../artifacts -maxdepth 1 -type f -name 'AnimeStream-*.apk' | wc -l)
          test "$artifact_count" -eq 5
          (
            cd ../artifacts
            sha256sum AnimeStream-*.apk > SHA256SUMS
          )
          {
            echo "versionCode=${GITHUB_RUN_NUMBER}"
            echo "package=de.ixacg.animestream"
            echo "signing=${SIGNING_MODE}"
            echo "certificateSha256=${APK_CERT_SHA256}"
            echo "api=${ANIMESTREAM_API_BASE_URL}"
            echo "variants=arm64-v8a,armeabi-v7a,x86_64,x86,universal"
          } > ../artifacts/build-info.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeStream-apk-${{ github.run_number }}
          path: |
            mobile/artifacts/AnimeStream-*.apk
            mobile/artifacts/build-info.txt
            mobile/artifacts/SHA256SUMS
          retention-days: 30

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnimeStream-android-reports-${{ github.run_number }}
          path: |
            mobile/android/app/build/reports/
            mobile/android/app/build/test-results/
            mobile/android/app/schemas/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_release &&
      needs.build.outputs.signing_mode == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: AnimeStream-apk-${{ github.run_number }}
          path: mobile/artifacts

      - name: Validate release assets
        run: |
          variants=(arm64-v8a armeabi-v7a x86_64 x86 universal)
          for variant in "${variants[@]}"; do
            test -s "mobile/artifacts/AnimeStream-${GITHUB_RUN_NUMBER}-${variant}.apk"
          done
          artifact_count=$(find mobile/artifacts -maxdepth 1 -type f -name 'AnimeStream-*.apk' | wc -l)
          test "$artifact_count" -eq 5
          (
            cd mobile/artifacts
            sha256sum -c SHA256SUMS
          )

      - name: Generate release notes
        run: |
          previous_tag=$(git tag --sort=-creatordate | grep '^build-' | grep -v "^build-${{ github.run_number }}$" | head -1 || true)
          signing=$(sed -n 's/^signing=//p' mobile/artifacts/build-info.txt)
          build=${{ github.run_number }}
          {
            echo "## Changes"
            echo
            if [ -n "$previous_tag" ]; then
              git log --no-merges --pretty=format:'- %s (%h)' "$previous_tag..HEAD"
            else
              git log --no-merges --pretty=format:'- %s (%h)' -20
            fi
            echo
            echo
            echo "## Android"
            echo
            echo "> Builds 39 and earlier used an Expo debug certificate. Android cannot update them to this production-signed build; uninstall the old app first. Uninstalling removes unsynced local data."
            echo
            echo "Pick the APK matching your device CPU. The universal APK contains all supported ABIs but is larger."
            echo
            echo "- \`AnimeStream-${build}-arm64-v8a.apk\` - most modern Android phones (recommended)"
            echo "- \`AnimeStream-${build}-armeabi-v7a.apk\` - older 32-bit phones"
            echo "- \`AnimeStream-${build}-x86_64.apk\` - 64-bit emulators and rare Intel devices"
            echo "- \`AnimeStream-${build}-x86.apk\` - 32-bit emulators and rare Intel devices"
            echo "- \`AnimeStream-${build}-universal.apk\` - contains all four supported ABIs; use when the CPU ABI is unknown"
            echo
            echo "Checksums for all APKs are available in \`SHA256SUMS\`."
            echo
            echo "- Signing mode: \`$signing\`"
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: AnimeStream Build ${{ github.run_number }}
          files: |
            mobile/artifacts/AnimeStream-*.apk
            mobile/artifacts/SHA256SUMS
          body_path: release-notes.md
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
