# AnimeStream application deployment. The database is managed separately.
# APP_IMAGE (owner/name) comes from .env; IMAGE_TAG selects the tag.
#   docker build -t "$APP_IMAGE:manga" .
#   IMAGE_TAG=manga PULL_POLICY=never docker compose up -d

services:
  app:
    image: ${APP_IMAGE:?set APP_IMAGE (owner/name) in .env}:${IMAGE_TAG:-manga}
    pull_policy: ${PULL_POLICY:-never}
    ports:
      - "${APP_HOST_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
