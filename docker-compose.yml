# AnimeStream — Docker Hub app-only deployment
#
# The server pulls the public sakurajiamai/hentaiworkers-app:latest image
# and connects it to an externally managed remote database.
# No build, migration, seed, ops, or crawler node runs in Compose.

services:
  app:
    image: sakurajiamai/hentaiworkers-app:latest
    pull_policy: always
    ports:
      # Host publish only: APP_HOST_BIND:APP_PORT -> container 3000
      - "${APP_HOST_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
