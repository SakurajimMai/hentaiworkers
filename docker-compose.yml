# AnimeStream production Compose
# - App: Next.js standalone on 127.0.0.1:3000
# - DB: remote MySQL only (no db service)
# - Worker: optional, profile "worker"
#
# Full guide: docs/deployment.md
#
# Quick start (build locally):
#   cp .env.example .env
#   # fill DATABASE_URL, SESSION_SECRET, APP_ENCRYPTION_KEYRING,
#   # APP_ENCRYPTION_CURRENT_KEY_ID, SITE_URL, ADMIN_BOOTSTRAP_*
#   # migrate + seed (Node 22 or one-shot container) — see docs/deployment.md §4
#   docker compose up -d --build app
#   curl -sS http://127.0.0.1:3000/api/live && curl -sS http://127.0.0.1:3000/api/ready
#
# Pull prebuilt Hub images (set DOCKERHUB_USERNAME in .env or shell):
#   docker compose pull app
#   docker compose up -d --no-build app
#
# Optional crawler worker:
#   # set CRAWLER_WORKER_ID + CRAWLER_WORKER_TOKEN from /admin crawler workers
#   docker compose --profile worker up -d --build
#
# Reverse proxy MUST terminate TLS and block public /api/internal/crawler/**

services:
  app:
    image: ${DOCKERHUB_USERNAME:-local}/hentaiworkers-app:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_HOST_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    restart: unless-stopped
    healthcheck:
      # node:22-alpine runner has no wget; use Node fetch against live probe
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # Production reverse proxy MUST block public access to:
    #   /api/internal/crawler/**

  crawler-worker:
    profiles: ["worker"]
    image: ${DOCKERHUB_USERNAME:-local}/hentaiworkers-worker:${WORKER_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      CRAWLER_CONTROL_URL: http://app:3000/api/internal/crawler/v1
      CRAWLER_WORKER_ID: ${CRAWLER_WORKER_ID:-1}
      CRAWLER_WORKER_TOKEN: ${CRAWLER_WORKER_TOKEN:?set a strong CRAWLER_WORKER_TOKEN}
      CRAWLER_TEMP_DIR: /var/tmp/crawler-worker
      CRAWLER_WORKER_VERSION: "1.0.0"
    # Explicitly do NOT pass DATABASE_URL / MYSQL_*
    volumes:
      - crawler-tmp:/var/tmp/crawler-worker
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    # No host ports — Worker only dials app over Compose DNS.

volumes:
  crawler-tmp:
