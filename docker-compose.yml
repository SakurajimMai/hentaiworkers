services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:3000/api/live",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Production ingress must block /api/internal/crawler/** from public clients.

  crawler-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      CRAWLER_CONTROL_URL: http://app:3000/api/internal/crawler/v1
      CRAWLER_WORKER_ID: ${CRAWLER_WORKER_ID:-1}
      CRAWLER_WORKER_TOKEN: ${CRAWLER_WORKER_TOKEN:?set a strong CRAWLER_WORKER_TOKEN}
      CRAWLER_TEMP_DIR: /var/tmp/crawler-worker
      CRAWLER_WORKER_VERSION: "1.0.0"
    # Explicitly do NOT pass DATABASE_URL / MYSQL_*
    volumes:
      - crawler-tmp:/var/tmp/crawler-worker
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    # No host ports — Worker only dials app over Compose DNS.

volumes:
  crawler-tmp:
